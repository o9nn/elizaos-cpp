name: C++ Build All (Fail-Never)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cpp/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp-build-all.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'cpp/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp-build-all.yml'
  workflow_dispatch:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  build-all-fail-never:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++ libcurl4-openssl-dev pkg-config nlohmann-json3-dev

    - name: Check compiler
      run: |
        echo "=== Compiler Info ==="
        g++ --version
        echo "===================="

    - name: Build all C++ files (fail-never mode)
      shell: bash
      run: |
        # Disable exit on error - this is the key for fail-never mode
        set +e
        
        echo "=== FAIL-NEVER BUILD TEST ==="
        echo "Building all .cpp files individually to collect all errors"
        echo ""
        
        # Create output directories
        mkdir -p build_results
        
        # Initialize counters
        SUCCESS=0
        FAILED=0
        TOTAL=0
        
        # Include paths
        INCLUDES="-I include -I cpp/include -I cpp -I cpp/packages/core/core/src -I cpp/packages/core/agentloop/src -I cpp/packages/core/agentmemory/src -I cpp/packages/infrastructure/agentcomms/src -I cpp/packages/infrastructure/agentlogger/src"
        
        # Compile flags (syntax check only, suppress warnings for speed)
        FLAGS="-std=c++17 -fsyntax-only -w"
        
        echo "Starting build at $(date)"
        echo ""
        
        # Initialize error log
        echo "# Build Errors Log" > build_results/errors.log
        echo "Generated: $(date)" >> build_results/errors.log
        echo "" >> build_results/errors.log
        
        # Process each module
        for dir in cpp/packages/core/*/ cpp/packages/infrastructure/*/ cpp/packages/applications/*/ cpp/packages/plugins/*/ cpp/packages/starters/*/ cpp/packages/integration/*/ cpp/external/*/ cpp/generated/*/; do
          MODULE=$(basename "$dir")
          echo "=== Module: $MODULE ==="
          
          # Find all cpp files in this module
          mapfile -t FILES < <(find "$dir" -name "*.cpp" -type f 2>/dev/null)
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "  (no .cpp files)"
            continue
          fi
          
          MODULE_SUCCESS=0
          MODULE_FAILED=0
          
          for file in "${FILES[@]}"; do
            TOTAL=$((TOTAL + 1))
            REL_PATH="${file#cpp/}"
            
            # Compile with syntax check only - capture output
            ERROR_OUTPUT=$(g++ $FLAGS $INCLUDES "$file" 2>&1)
            COMPILE_RESULT=$?
            
            if [ $COMPILE_RESULT -eq 0 ]; then
              MODULE_SUCCESS=$((MODULE_SUCCESS + 1))
              SUCCESS=$((SUCCESS + 1))
            else
              MODULE_FAILED=$((MODULE_FAILED + 1))
              FAILED=$((FAILED + 1))
              
              # Extract first error line
              FIRST_ERROR=$(echo "$ERROR_OUTPUT" | head -1 | cut -c1-100)
              echo "  FAIL: $REL_PATH"
              echo "        $FIRST_ERROR"
              
              # Log to file
              echo "=== $REL_PATH ===" >> build_results/errors.log
              echo "$ERROR_OUTPUT" >> build_results/errors.log
              echo "" >> build_results/errors.log
            fi
          done
          
          echo "  Results: $MODULE_SUCCESS OK, $MODULE_FAILED FAILED"
          echo ""
        done
        
        echo "========================================"
        echo "=== BUILD SUMMARY ==="
        echo "Total files: $TOTAL"
        echo "Success: $SUCCESS"
        echo "Failed: $FAILED"
        PCT=0
        if [ $TOTAL -gt 0 ]; then
          PCT=$((SUCCESS * 100 / TOTAL))
          echo "Success rate: $PCT%"
        fi
        echo "========================================"
        
        # Save summary
        cat > build_results/summary.json << EOF
        {
          "timestamp": "$(date -Iseconds)",
          "total_files": $TOTAL,
          "success": $SUCCESS,
          "failed": $FAILED,
          "success_rate": "$PCT%"
        }
        EOF
        
        echo ""
        echo "Build completed at $(date)"
        
        # Always exit successfully - this is fail-never mode
        exit 0

    - name: Analyze error categories
      if: always()
      run: |
        echo "=== ERROR CATEGORY ANALYSIS ==="
        
        if [ -f build_results/errors.log ]; then
          echo ""
          echo "Missing includes (No such file or directory):"
          grep -c "No such file or directory" build_results/errors.log || echo "0"
          
          echo ""
          echo "Undeclared identifiers:"
          grep -c "was not declared" build_results/errors.log || echo "0"
          
          echo ""
          echo "Syntax errors:"
          grep -c "expected" build_results/errors.log || echo "0"
          
          echo ""
          echo "Top 10 missing headers:"
          grep "No such file or directory" build_results/errors.log | \
            sed 's/.*fatal error: //' | sed 's/: No such file.*//' | \
            sort | uniq -c | sort -rn | head -10 || echo "None"
          
          echo ""
          echo "Modules with most errors:"
          grep "^===" build_results/errors.log | \
            sed 's/=== //' | sed 's/ ===//' | \
            cut -d'/' -f1 | sort | uniq -c | sort -rn | head -10 || echo "None"
        else
          echo "No errors logged"
        fi

    - name: Upload build results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-results-${{ github.sha }}
        path: build_results/
        retention-days: 30

    - name: Create build badge data
      if: always()
      run: |
        if [ -f build_results/summary.json ]; then
          cat build_results/summary.json
          SUCCESS=$(grep -o '"success": [0-9]*' build_results/summary.json | grep -o '[0-9]*' || echo "0")
          TOTAL=$(grep -o '"total_files": [0-9]*' build_results/summary.json | grep -o '[0-9]*' || echo "0")
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$((SUCCESS * 100 / TOTAL))
            echo "Build success rate: $PCT%"
            
            # Determine badge color
            if [ $PCT -ge 80 ]; then
              COLOR="brightgreen"
            elif [ $PCT -ge 60 ]; then
              COLOR="yellow"
            elif [ $PCT -ge 40 ]; then
              COLOR="orange"
            else
              COLOR="red"
            fi
            
            echo "BADGE_PCT=$PCT" >> $GITHUB_ENV
            echo "BADGE_COLOR=$COLOR" >> $GITHUB_ENV
          fi
        fi

  module-status:
    runs-on: ubuntu-latest
    needs: build-all-fail-never
    if: always()
    
    steps:
    - uses: actions/checkout@v4

    - name: Generate module status report
      run: |
        set +e
        
        echo "# Module Build Status Report" > MODULE_STATUS.md
        echo "" >> MODULE_STATUS.md
        echo "Generated: $(date)" >> MODULE_STATUS.md
        echo "" >> MODULE_STATUS.md
        echo "| Module | Files | Status |" >> MODULE_STATUS.md
        echo "|--------|-------|--------|" >> MODULE_STATUS.md
        
        for dir in cpp/packages/core/*/ cpp/packages/infrastructure/*/ cpp/packages/applications/*/ cpp/packages/plugins/*/ cpp/packages/starters/*/ cpp/packages/integration/*/ cpp/external/*/ cpp/generated/*/; do
          MODULE=$(basename "$dir")
          FILE_COUNT=$(find "$dir" -name "*.cpp" -type f 2>/dev/null | wc -l)
          
          # Quick syntax check on first file
          FIRST_FILE=$(find "$dir" -name "*.cpp" -type f 2>/dev/null | head -1)
          if [ -n "$FIRST_FILE" ]; then
            g++ -std=c++17 -fsyntax-only -w -I include -I cpp/include -I cpp "$FIRST_FILE" 2>/dev/null
            if [ $? -eq 0 ]; then
              STATUS="✅ OK"
            else
              STATUS="❌ Errors"
            fi
          else
            STATUS="⚪ No files"
          fi
          
          echo "| $MODULE | $FILE_COUNT | $STATUS |" >> MODULE_STATUS.md
        done
        
        echo "" >> MODULE_STATUS.md
        echo "---" >> MODULE_STATUS.md
        echo "*This report is auto-generated by the fail-never build workflow*" >> MODULE_STATUS.md
        
        cat MODULE_STATUS.md

    - name: Upload module status
      uses: actions/upload-artifact@v4
      with:
        name: module-status-${{ github.sha }}
        path: MODULE_STATUS.md
        retention-days: 30
