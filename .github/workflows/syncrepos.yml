name: Fetch & Sync Repositories

on:
  workflow_dispatch:
    inputs:
      org_name:
        description: 'Organization name to sync from (default: elizaOS)'
        required: false
        default: 'elizaOS'
        type: string

jobs:
  fetch:
    uses: ./.github/workflows/fetch.yml

  sync:
    needs: fetch
    uses: ./.github/workflows/sync.yml
    with:
      org_name: ${{ inputs.org_name || 'elizaOS' }}
